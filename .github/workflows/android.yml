name: Android CI

# Pushes to main are built, tested, and published by nightly.yml.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Unit tests and debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version-file: .java-version

      - uses: android-actions/setup-android@v4

      - name: Android SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null
          sdkmanager "platform-tools" "platforms;android-37.0" "build-tools;37.0.0"

      - uses: gradle/actions/setup-gradle@v6

      - name: Test data publication helpers
        run: python3 -m unittest discover -s scripts/tests -p test_data_assets.py

      - name: Verify certificate parser
        run: bash scripts/test_apk_certificate.sh

      - name: Unit tests
        run: ./build.sh testDebugUnitTest --no-daemon --build-cache

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-report
          path: app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore

      - name: Assemble debug APK
        run: ./build.sh assembleDebug --no-daemon --build-cache

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: fieldwatch-nanashi-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
